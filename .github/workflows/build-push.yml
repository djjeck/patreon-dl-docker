name: Build and push

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-examples:
    # Only verify on tag pushes, just before publishing a versioned image.
    # PRs are excluded to avoid failing Dependabot package-bump PRs — syncing
    # happens after merge via auto-tag.yml, not during the PR.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify example files match upstream
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['patreon-dl']")
          TAG="v${VERSION}"
          BASE="https://raw.githubusercontent.com/patrickkfkan/patreon-dl/${TAG}"

          # Mirror the fetch_upstream calls in auto-tag.yml — keep these in sync.
          verify_upstream() {
            local remote="$1" local_path="$2"
            echo "Verifying ${local_path} against upstream ${TAG}/${remote}..."
            UPSTREAM=$(curl -fsSL "${BASE}/${remote}")
            LOCAL=$(cat "${local_path}")
            if [ "${UPSTREAM}" != "${LOCAL}" ]; then
              echo "FAIL: ${local_path} does not match upstream ${TAG}/${remote}" >&2
              diff <(echo "${UPSTREAM}") <(echo "${LOCAL}") >&2
              exit 1
            fi
            echo "OK"
          }

          verify_upstream example.conf config/config.conf.example

  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.first-tag.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Set build metadata
        id: meta-vars
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          VERSION=$(node -p "require('./package.json').dependencies['patreon-dl']")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo "$VERSION" | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.meta-vars.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.meta-vars.outputs.version }}-${{ steps.meta-vars.outputs.date }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.meta-vars.outputs.minor }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=edge,branch=main
            type=raw,value=edge-${{ steps.meta-vars.outputs.date }},enable=${{ github.ref_type != 'tag' && github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Store first image tag for downstream jobs
        id: first-tag
        run: echo "value=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> $GITHUB_OUTPUT

      - name: Export image artifact
        run: |
          docker save $(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ') \
            -o /tmp/image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests
        env:
          TEST_IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: pytest -v

  push:
    needs: [verify-examples, test]
    if: |
      always() &&
      (needs.verify-examples.result == 'success' || needs.verify-examples.result == 'skipped') &&
      needs.test.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Set build metadata
        id: meta-vars
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          VERSION=$(node -p "require('./package.json').dependencies['patreon-dl']")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo "$VERSION" | cut -d. -f1,2)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.meta-vars.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.meta-vars.outputs.version }}-${{ steps.meta-vars.outputs.date }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.meta-vars.outputs.minor }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=edge,branch=main
            type=raw,value=edge-${{ steps.meta-vars.outputs.date }},enable=${{ github.ref_type != 'tag' && github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          echo '${{ steps.meta.outputs.tags }}' | while read tag; do
            docker push "$tag"
          done
